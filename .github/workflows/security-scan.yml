name: Security Scan

# Authority threshold for pull requests — always loaded from the default branch.
#
#   static    deterministic checks, always runs, always blocks
#   scanners  Semgrep + OSV + Gitleaks -> SARIF -> triaged, blocks on error severity
#   codeql    interprocedural taint analysis, uploads to code scanning
#   ai-review the lens channel (optional; not a required check)
#   verify    regression suite + probes + corpus thresholds
#
# Triggers:
#   workflow_run  — PR path. The workflow file is taken from the default branch, so a PR
#                   cannot neuter required jobs by editing this YAML on its branch.
#   push/master   — post-merge regression on the integrated tree
#   workflow_dispatch — manual
#
# Required status check names (branch protection): static, scanners, verify.
# On the PR path those names are published as Check Runs on the PR head SHA.
#
# Optional model secrets for ai-review sit behind the `security-ai` environment.
# Configure required reviewers on that environment so keys never flow without approval.

on:
  # pull_request: keeps CI working for the PR that introduces workflow_run (chicken-egg:
  # workflow_run listeners only fire from the default branch). After this lands on master,
  # a follow-up can drop pull_request so authority is only the default-branch path.
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Security PR Trigger"]
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:

# Default: nothing. Each job opts into the minimum it needs.
permissions: {}

concurrency:
  group: security-scan-${{ github.event.workflow_run.head_branch || github.ref }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Mark check in progress
        if: github.event_name == 'workflow_run'
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'static',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', String(data.id));

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install gate from base / default branch (not from the PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            rm -rf security
            git checkout "origin/${{ github.base_ref }}" -- security/
          else
            git fetch --no-tags origin master
            rm -rf security
            git checkout origin/master -- security/
          fi

      - name: Deterministic checks
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x security/gate/static-checks.sh
          BASE_REF="origin/master"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_BASE=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].base.ref // empty' 2>/dev/null || true)
            if [ -n "$PR_BASE" ]; then
              git fetch --no-tags origin "$PR_BASE"
              BASE_REF="origin/$PR_BASE"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if git rev-parse --verify origin/master~1 >/dev/null 2>&1; then
              BASE_REF="origin/master~1"
            fi
          fi
          security/gate/static-checks.sh "$BASE_REF"

      - name: Complete check
        if: always() && github.event_name == 'workflow_run' && steps.check.outputs.check_id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const id = Number('${{ steps.check.outputs.check_id }}');
            if (!id) return;
            const ok = '${{ steps.run.outcome }}' === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: id,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });

  scanners:
    name: scanners
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - name: Mark check in progress
        if: github.event_name == 'workflow_run'
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'scanners',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', String(data.id));

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install gate from base / default branch (not from the PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            rm -rf security
            git checkout "origin/${{ github.base_ref }}" -- security/
          else
            git fetch --no-tags origin master
            rm -rf security
            git checkout origin/master -- security/
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      - name: Install scanners
        run: |
          pip install --quiet semgrep==1.172.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin master
          BASE_REF="origin/master"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_BASE=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].base.ref // empty' 2>/dev/null || true)
            if [ -n "$PR_BASE" ]; then
              git fetch --no-tags origin "$PR_BASE"
              BASE_REF="origin/$PR_BASE"
            fi
          fi
          git diff "$BASE_REF"...HEAD > /tmp/pr.diff

      - name: Run scanners
        run: |
          chmod +x security/scanners/run-scanners.sh
          security/scanners/run-scanners.sh . security-report/sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: security-report/sarif
          category: security-scan

      - name: Normalize SARIF
        run: |
          node security/scanners/normalize.mjs \
            --sarif security-report/sarif \
            --diff /tmp/pr.diff \
            --out security-report/findings.json \
            --no-gate

      # Triage secrets are optional. Without keys, findings pass through untriaged (fail-closed
      # on scanner severity). Keys live as repository secrets; do not grant this job write
      # scopes beyond security-events for SARIF upload.
      - name: Triage and gate
        id: run
        env:
          SECURITY_AI_API_KEY: ${{ secrets.SECURITY_AI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node security/redteam/triage.mjs \
            --findings security-report/findings.json \
            --repo . \
            --out security-report/triaged.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scanner-findings
          path: security-report/
          if-no-files-found: ignore

      - name: Complete check
        if: always() && github.event_name == 'workflow_run' && steps.check.outputs.check_id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const id = Number('${{ steps.check.outputs.check_id }}');
            if (!id) return;
            const ok = '${{ steps.run.outcome }}' === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: id,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });

  codeql:
    name: codeql
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          category: codeql

  ai-review:
    name: ai-review
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Optional: add required reviewers on this environment so model keys never auto-run on a PR.
    environment: security-ai
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install gate from base / default branch (not from the PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            rm -rf security
            git checkout "origin/${{ github.base_ref }}" -- security/
          else
            git fetch --no-tags origin master
            rm -rf security
            git checkout origin/master -- security/
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20' }

      - name: Build diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin master
          BASE_REF="origin/master"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_BASE=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].base.ref // empty' 2>/dev/null || true)
            if [ -n "$PR_BASE" ]; then
              git fetch --no-tags origin "$PR_BASE"
              BASE_REF="origin/$PR_BASE"
            fi
          fi
          git diff "$BASE_REF"...HEAD > /tmp/pr.diff

      - name: Lens review (hunt -> verify)
        env:
          SECURITY_AI_API_KEY: ${{ secrets.SECURITY_AI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node security/redteam/harness.mjs --diff /tmp/pr.diff --out security-report

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-findings
          path: security-report/
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('security-report/report.md')) return;
            const body = fs.readFileSync('security-report/report.md', 'utf8');
            const marker = '<!-- security-scan -->';
            let issue_number = (context.payload.workflow_run.pull_requests || [])[0]?.number;
            if (!issue_number) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              const open = data.find(
                (p) =>
                  p.state === 'open' &&
                  p.head.repo &&
                  p.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
              );
              if (!open) return;
              issue_number = open.number;
            }
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = existing.data.find((c) => c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

  # verify — regression of the PR's own security/ tree. Least privilege: contents:read only
  # for the run itself; checks:write solely to report the required check name on the PR head.
  verify:
    name: verify
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Mark check in progress
        if: github.event_name == 'workflow_run'
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'verify',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', String(data.id));

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      - name: Install Semgrep
        run: pip install --quiet semgrep==1.172.0

      - name: Gate regression suite
        id: suite
        run: bash security/gate/gate.test.sh

      - name: Probes
        id: probes
        run: node security/prove/run-probes.mjs

      - name: Corpus thresholds
        id: eval
        run: node security/eval/run.mjs --no-ai

      - name: Complete check
        if: always() && github.event_name == 'workflow_run' && steps.check.outputs.check_id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const id = Number('${{ steps.check.outputs.check_id }}');
            if (!id) return;
            const ok =
              '${{ steps.suite.outcome }}' === 'success' &&
              '${{ steps.probes.outcome }}' === 'success' &&
              '${{ steps.eval.outcome }}' === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: id,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });
