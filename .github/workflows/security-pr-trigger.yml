name: Security PR Trigger

# Minimal pull_request entrypoint. The authoritative jobs live in security-scan.yml and run
# ONLY via workflow_run from the default branch, so a PR cannot rewrite the gate that
# judges it. This workflow holds no secrets and no write permissions beyond contents:read.
#
# Job names here must NEVER match the required checks (static / scanners / verify).
# Those names are published only by the default-branch authority workflow.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: security-pr-trigger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hand off to default-branch authority workflow
        run: |
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          echo "Base:    ${{ github.event.pull_request.base.ref }}"
          echo "Authority workflow runs from the default branch via workflow_run."
          echo "Required check names (static/scanners/verify) are NOT published here."

  # Regression of the PR head's security/ tree. Name deliberately not a required check.
  # After master has the workflow_run authority, required names come only from there.
  pr-head-regression:
    name: pr-head-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Install Semgrep
        run: pip install --quiet semgrep==1.172.0
      - name: Gate regression suite
        run: bash security/gate/gate.test.sh
      - name: Probes
        run: node security/prove/run-probes.mjs
      - name: Corpus thresholds
        run: node security/eval/run.mjs --no-ai
