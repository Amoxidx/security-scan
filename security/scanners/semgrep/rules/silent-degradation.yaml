rules:
  - id: crypto-fallback-in-catch
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A catch block around a cryptographic call reaches for Math.random() instead of failing.
      This is the COLDCARD pattern: the guarantee drops silently, the output still looks
      random, and the tests stay green. Fail closed.
    metadata:
      cwe: "CWE-693: Protection Mechanism Failure"
      category: security
      class: silent-degradation
    # Written as "the weak call, anywhere inside a catch" rather than one try/catch shape.
    # The previous version spelled out `catch(...)`, which is not valid JavaScript pattern
    # syntax — semgrep rejected the rule and the whole ruleset exited 2 while the remaining
    # rules kept producing results. The rule was dead for its entire existence and nothing
    # said so. `...` also does not reach expressions nested inside a loop in the catch body,
    # so even a parsing version of that shape would have missed the corpus case.
    patterns:
      - pattern: Math.random(...)
      - pattern-inside: |
          try { ... } catch($E) { ... }

  - id: verification-returns-true-when-unconfigured
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A verification function returns true when its key or configuration is missing. A
      missing config value becomes an authentication bypass. Fail closed.
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      category: security
      class: silent-degradation
    patterns:
      - pattern-either:
          - pattern: |
              function $F(...) { ... if (!$KEY) { ... return true; } ... }
          - pattern: |
              function $F(...) { ... if ($KEY === undefined) { ... return true; } ... }
          - pattern: |
              function $F(...) { ... if ($KEY == null) { ... return true; } ... }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(verify|validate|check|auth|authenticate|assert).*
